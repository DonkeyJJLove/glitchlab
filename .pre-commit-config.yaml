repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: []
        exclude: ^(\.githooks/|temp/|src/glitchlab\.egg-info/|\.venv/|venv/|build/|dist/)
  - repo: local
    hooks:
      - id: jsonschema-validate
        name: jsonschema-validate
        entry: python -m tools.jsonschema_validate
        language: python
        files: ^(.glx/|spec/)
        additional_dependencies:
          - jsonschema>=4

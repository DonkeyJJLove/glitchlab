name: Ruff Debt 17 B1A Executor

on:
  push:
    branches:
      - exec/glitchlab-ruff-debt-17-b1a-up006

permissions:
  contents: write

jobs:
  execute-b1a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact baseline
        uses: actions/checkout@v6
        with:
          ref: 7a06d479f5e0c6d68174eecb585eed22c7e40792
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      - name: Install exact toolchain
        run: |
          python -m pip install -U pip
          python -m pip install "setuptools<81"
          pip install -e .[dev]
          python -m pip install --upgrade --force-reinstall "ruff==0.16.3"
          test "$(ruff --version)" = "ruff 0.16.3"
          ruff --version | tee /tmp/ruff-version.txt

      - name: Execute bounded UP006 transformation and verify
        env:
          BASELINE: 7a06d479f5e0c6d68174eecb585eed22c7e40792
          CANDIDATE_BRANCH: mission/glitchlab-ruff-debt-17-b1a-up006
        run: |
          set -euo pipefail

          FILES=(
            analysis/fields.py
            analysis/ast_index.py
            analysis/mosaic_meta.py
            analysis/graph_metrics.py
            analysis/scope_meta.py
          )

          printf '%s\n' "${FILES[@]}" | sort > /tmp/allowed-paths.txt

          set +e
          ruff check . --force-exclude --output-format json > /tmp/ruff-before-full.json
          rc=$?
          set -e
          [ "$rc" -le 1 ]

          set +e
          ruff check "${FILES[@]}" --select UP006 --output-format json > /tmp/ruff-before-up006.json
          rc=$?
          set -e
          [ "$rc" -le 1 ]

          python - <<'PY'
          import json, pathlib
          rows = json.loads(pathlib.Path('/tmp/ruff-before-up006.json').read_text())
          assert len(rows) == 231, f"expected 231 scoped UP006 findings, got {len(rows)}"
          assert all(r.get('code') == 'UP006' for r in rows), 'non-UP006 finding in scoped baseline'
          PY

          ruff check "${FILES[@]}" --select UP006 --fix

          git diff --name-only --diff-filter=ACMRT | sort > /tmp/actual-paths.txt
          diff -u /tmp/allowed-paths.txt /tmp/actual-paths.txt

          set +e
          ruff check "${FILES[@]}" --select UP006 --output-format json > /tmp/ruff-after-up006.json
          rc=$?
          set -e
          [ "$rc" -le 1 ]

          python - <<'PY'
          import json, pathlib
          rows = json.loads(pathlib.Path('/tmp/ruff-after-up006.json').read_text())
          assert len(rows) == 0, f"scoped UP006 debt not eliminated: {len(rows)} remains"
          PY

          set +e
          ruff check . --force-exclude --output-format json > /tmp/ruff-after-full.json
          rc=$?
          set -e
          [ "$rc" -le 1 ]

          python - <<'PY'
          import collections, json, pathlib

          before = json.loads(pathlib.Path('/tmp/ruff-before-full.json').read_text())
          after = json.loads(pathlib.Path('/tmp/ruff-after-full.json').read_text())
          cb = collections.Counter(r['code'] for r in before)
          ca = collections.Counter(r['code'] for r in after)
          regressions = {k: (cb[k], ca[k]) for k in set(cb) | set(ca) if k != 'UP006' and ca[k] > cb[k]}
          assert not regressions, f"non-UP006 regressions: {regressions}"
          assert ca['UP006'] < cb['UP006'], f"UP006 did not decrease: {cb['UP006']} -> {ca['UP006']}"
          assert len(after) <= len(before), f"full-tree debt increased: {len(before)} -> {len(after)}"

          summary = {
              'baseline': '7a06d479f5e0c6d68174eecb585eed22c7e40792',
              'ruff_version': 'ruff 0.16.3',
              'rule': 'UP006',
              'scoped_before': 231,
              'scoped_after': 0,
              'full_total_before': len(before),
              'full_total_after': len(after),
              'up006_before': cb['UP006'],
              'up006_after': ca['UP006'],
              'non_up006_regressions': regressions,
              'counts_before': dict(sorted(cb.items())),
              'counts_after': dict(sorted(ca.items())),
          }
          pathlib.Path('/tmp/b1a-summary-pretests.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

          python -m compileall -q "${FILES[@]}"
          PYTHONPATH="${GITHUB_WORKSPACE}" pytest -q

          git config user.name "LION B1A Executor"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${FILES[@]}"
          git diff --cached --name-only | sort > /tmp/staged-paths.txt
          diff -u /tmp/allowed-paths.txt /tmp/staged-paths.txt
          git commit -m "B1A: apply bounded UP006 fixes"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "$CANDIDATE_SHA" > /tmp/candidate-sha.txt

          python -m glx.tools.delta_fingerprint --range "${BASELINE}..${CANDIDATE_SHA}"
          python -m glx.tools.invariants_check --range "${BASELINE}..${CANDIDATE_SHA}"

          git diff --name-only "${BASELINE}..${CANDIDATE_SHA}" | sort > /tmp/committed-paths.txt
          diff -u /tmp/allowed-paths.txt /tmp/committed-paths.txt

          python - <<'PY'
          import json, pathlib, subprocess
          p = pathlib.Path('/tmp/b1a-summary-pretests.json')
          s = json.loads(p.read_text())
          s.update({
              'compile': 'PASS',
              'pytest': 'PASS',
              'invariants': 'PASS',
              'candidate_sha': pathlib.Path('/tmp/candidate-sha.txt').read_text().strip(),
              'candidate_branch': 'mission/glitchlab-ruff-debt-17-b1a-up006',
              'changed_paths': pathlib.Path('/tmp/committed-paths.txt').read_text().splitlines(),
          })
          pathlib.Path('/tmp/b1a-summary.json').write_text(json.dumps(s, indent=2, sort_keys=True))
          print(json.dumps(s, indent=2, sort_keys=True))
          PY

          git push --force-with-lease origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"

      - name: Upload B1A verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: glitchlab-ruff-debt-17-b1a
          path: |
            /tmp/ruff-version.txt
            /tmp/allowed-paths.txt
            /tmp/actual-paths.txt
            /tmp/staged-paths.txt
            /tmp/committed-paths.txt
            /tmp/ruff-before-full.json
            /tmp/ruff-after-full.json
            /tmp/ruff-before-up006.json
            /tmp/ruff-after-up006.json
            /tmp/b1a-summary-pretests.json
            /tmp/b1a-summary.json
            /tmp/candidate-sha.txt
            glitchlab/.glx/delta_report.json
            glitchlab/.glx/commit_analysis.json
            glitchlab/.glx/spec_state.json
          if-no-files-found: warn
          include-hidden-files: true

name: GLX CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system / dev extras
        run: |
          python -m pip install -U pip
          python -m pip install "setuptools<81"
          pip install -e .[dev]

      - name: Determine DIFF range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "DIFF_RANGE=${RANGE}" >> $GITHUB_ENV
          echo "Using range: ${RANGE}"

      - name: Ruff critical gate (whole repository)
        run: |
          # Keep correctness/syntax classes blocking across the complete tree.
          # Legacy F821 is explicitly excluded in pyproject until its existing backlog
          # is removed under a dedicated ratchet issue.
          ruff check . --force-exclude --select E9,F63,F7,F82

      - name: Ruff changed Python files (ratchet)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- '*.py')
          else
            FILES=$(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD -- '*.py')
          fi

          if [ -n "$FILES" ]; then
            echo "$FILES"
            ruff check $FILES --force-exclude
          else
            echo "No Python files changed; full style lint skipped. Critical whole-repo gate already passed."
          fi

      - name: Black (format check)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- '*.py')
          else
            FILES=$(git diff --name-only --diff-filter=ACMRT \
              HEAD~1 HEAD -- '*.py')
          fi

          if [ -n "$FILES" ]; then
            python -m black --check $FILES
          else
            echo "No Python files changed; skipping Black."
          fi

      - name: Mypy (type check)
        run: mypy --ignore-missing-imports --allow-untyped-defs tools/jsonschema_validate.py

      - name: Pytest
        run: PYTHONPATH="${{ github.workspace }}" pytest -q

      - name: Coverage (run + upload as artifact)
        if: always()
        run: |
          pip install coverage
          PYTHONPATH="${{ github.workspace }}" coverage run -m pytest
          coverage xml -i

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Doclint (docs consistency)
        continue-on-error: true
        run: python -m glx.tools.doclint

      - name: Delta fingerprint (DIFF-first)
        run: python -m glx.tools.delta_fingerprint --range "${{ env.DIFF_RANGE }}"

      - name: Invariants check (I1–I4 gates)
        run: python -m glx.tools.invariants_check --range "${{ env.DIFF_RANGE }}"

      - name: Upload GLX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glx-artifacts-${{ matrix.python-version }}
          path: |
            glitchlab/.glx/delta_report.json
            glitchlab/.glx/commit_analysis.json
            glitchlab/.glx/spec_state.json
            glitchlab/.glx/*.png
          if-no-files-found: ignore

      - name: Comment on PR (summary)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.9'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function readJson(p) {
              try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch (e) { return null; }
            }
            const delta = readJson('glitchlab/.glx/delta_report.json') || {};
            const analysis = readJson('glitchlab/.glx/commit_analysis.json') || {};
            const lines = [];
            lines.push('### GLX Δ Summary');
            if (delta.hist) {
              const keys = Object.keys(delta.hist);
              const top = keys.sort((a,b) => (delta.hist[b]||0)-(delta.hist[a]||0)).slice(0,8).map(k => `\`${k}\`×${delta.hist[k]}`);
              lines.push(`**Δ-tokens:** ${top.join(', ')}`);
            } else {
              lines.push('_Brak delta_report.json_');
            }
            if (delta.hash) lines.push(`**Fingerprint:** \`${delta.hash}\``);
            if (analysis.score !== undefined) lines.push(`**Score:** ${analysis.score}  | thresholds α=${analysis.thresholds?.alpha} β=${analysis.thresholds?.beta} Z=${analysis.thresholds?.z}`);
            if (analysis.violations && analysis.violations.length) {
              lines.push(`**Violations:** ${analysis.violations.map(v => `\`${v.invariant}\`(${v.severity})`).join(', ')}`);
            }
            const body = lines.join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

name: GLX CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system / dev extras
        run: |
          python -m pip install -U pip
          python -m pip install "setuptools<81"
          pip install -e .[dev]

      - name: Determine DIFF range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_SHA=$(git merge-base "${{ github.event.pull_request.base.sha }}" "$HEAD_SHA")
          else
            HEAD_SHA=$(git rev-parse HEAD)
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          echo "DIFF_BASE=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "DIFF_HEAD=${HEAD_SHA}" >> "$GITHUB_ENV"
          echo "DIFF_RANGE=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_ENV"
          echo "Using range: ${BASE_SHA}..${HEAD_SHA}"

      - name: Verify tracked workspace is clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short --untracked-files=no
            echo "::error::Tracked workspace mutated before CI gates."
            exit 1
          fi

      - name: Ruff critical gate (whole repository)
        run: |
          # Keep correctness/syntax classes, including F821 undefined names,
          # blocking across the complete tree.
          ruff check . --force-exclude --select E9,F63,F7,F82

      - name: Ruff changed Python files (no-regression ratchet)
        if: always()
        run: |
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMRT "$DIFF_BASE" "$DIFF_HEAD" -- '*.py')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Python files changed; ratchet passed."
            exit 0
          fi

          BASE_DIR=$(mktemp -d)
          export BASE_DIR
          for file in "${FILES[@]}"; do
            if git cat-file -e "$DIFF_BASE:$file" 2>/dev/null; then
              mkdir -p "$BASE_DIR/$(dirname "$file")"
              git show "$DIFF_BASE:$file" > "$BASE_DIR/$file"
            fi
          done

          set +e
          ruff check "$BASE_DIR" --config pyproject.toml --output-format json > /tmp/ruff-base.json
          BASE_RC=$?
          ruff check "${FILES[@]}" --force-exclude --output-format json > /tmp/ruff-head.json
          HEAD_RC=$?
          set -e
          [ "$BASE_RC" -le 1 ] && [ "$HEAD_RC" -le 1 ] || exit 2

          python - <<'PY'
          import collections
          import json
          import os
          import pathlib

          def counts(path, root):
              rows = json.loads(pathlib.Path(path).read_text())
              out = collections.Counter()
              for row in rows:
                  name = pathlib.Path(row["filename"]).resolve().relative_to(root)
                  out[(str(name), row["code"])] += 1
              return out

          before = counts("/tmp/ruff-base.json", pathlib.Path(os.environ["BASE_DIR"]).resolve())
          after = counts("/tmp/ruff-head.json", pathlib.Path.cwd().resolve())
          regressions = {key: n for key, n in after.items() if n > before[key]}
          if regressions:
              for (name, code), n in sorted(regressions.items()):
                  print(f"regression: {name} {code}: {before[(name, code)]} -> {n}")
              raise SystemExit(1)
          print("Ruff ratchet passed: no per-file/per-rule regression.")
          PY

      - name: Black (format no-regression ratchet)
        if: always()
        run: |
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMRT "$DIFF_BASE" "$DIFF_HEAD" -- '*.py')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Python files changed; Black ratchet passed."
            exit 0
          fi

          BASE_DIR=$(mktemp -d)
          for file in "${FILES[@]}"; do
            base_bad=0
            head_bad=0
            if git cat-file -e "$DIFF_BASE:$file" 2>/dev/null; then
              mkdir -p "$BASE_DIR/$(dirname "$file")"
              git show "$DIFF_BASE:$file" > "$BASE_DIR/$file"
              black --check "$BASE_DIR/$file" >/dev/null 2>&1 || base_bad=1
            fi
            black --check "$file" >/dev/null 2>&1 || head_bad=1
            if [ "$head_bad" -gt "$base_bad" ]; then
              echo "::error file=$file::Black formatting regression (${base_bad} -> ${head_bad})."
              exit 1
            fi
          done
          echo "Black ratchet passed: no changed file introduced formatting debt."

      - name: Mypy (type check)
        if: always()
        run: mypy --ignore-missing-imports --allow-untyped-defs tools/jsonschema_validate.py

      - name: Pytest
        if: always()
        run: PYTHONPATH="${{ github.workspace }}" pytest -q

      - name: Coverage (run + upload as artifact)
        if: always()
        run: |
          pip install coverage
          PYTHONPATH="${{ github.workspace }}" coverage run -m pytest
          coverage xml -i

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      - name: Doclint (docs consistency)
        if: always()
        run: python -m glx.tools.doclint

      - name: Delta fingerprint (DIFF-first)
        if: always()
        run: python -m glx.tools.delta_fingerprint --range "${{ env.DIFF_RANGE }}"

      - name: Invariants check (I1–I4 gates)
        if: always()
        run: python -m glx.tools.invariants_check --range "${{ env.DIFF_RANGE }}"

      - name: Upload GLX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glx-artifacts-${{ matrix.python-version }}
          path: |
            glitchlab/.glx/delta_report.json
            glitchlab/.glx/commit_analysis.json
            glitchlab/.glx/spec_state.json
            glitchlab/.glx/*.png
          if-no-files-found: error
          include-hidden-files: true

      - name: Comment on PR (summary)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.9'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function readJson(p) {
              try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch (e) { return null; }
            }
            const delta = readJson('glitchlab/.glx/delta_report.json') || {};
            const analysis = readJson('glitchlab/.glx/commit_analysis.json') || {};
            const lines = [];
            lines.push('### GLX Δ Summary');
            if (delta.hist) {
              const keys = Object.keys(delta.hist);
              const top = keys.sort((a,b) => (delta.hist[b]||0)-(delta.hist[a]||0)).slice(0,8).map(k => `\`${k}\`×${delta.hist[k]}`);
              lines.push(`**Δ-tokens:** ${top.join(', ')}`);
            } else {
              lines.push('_Brak delta_report.json_');
            }
            if (delta.hash) lines.push(`**Fingerprint:** \`${delta.hash}\``);
            if (analysis.score !== undefined) lines.push(`**Score:** ${analysis.score}  | thresholds α=${analysis.thresholds?.alpha} β=${analysis.thresholds?.beta} Z=${analysis.thresholds?.z}`);
            if (analysis.violations && analysis.violations.length) {
              lines.push(`**Violations:** ${analysis.violations.map(v => `\`${v.invariant}\`(${v.severity})`).join(', ')}`);
            }
            const body = lines.join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
